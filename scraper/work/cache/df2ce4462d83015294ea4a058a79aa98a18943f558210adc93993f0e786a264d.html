<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | CSE IIT Bombay</title>

  <style>
    :root {
      --primary: #004f9f;
      --secondary: #7db9f5;
      --light: #ffffff;
      --text: #333333;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
      padding: 30px 20px;
    }

    .code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
      line-height: 1;
    }

    .accent-bar {
      width: 70px;
      height: 4px;
      background: var(--secondary);
      margin: 15px auto 25px;
      border-radius: 2px;
    }

    h2 {
      font-size: 1.6rem;
      margin: 0 0 10px;
      color: var(--primary);
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
      margin: 0 auto;
      max-width: 500px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 22px;
      background-color: var(--primary);
      color: var(--light);
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #003b77;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #777;
    }

    /* 📱 Mobile */
    @media (max-width: 600px) {
      .code {
        font-size: 4.5rem;
      }

      h2 {
        font-size: 1.3rem;
      }

      p {
        font-size: 0.95rem;
      }

      .btn {
        width: 100%;
        max-width: 280px;
      }
    }

    /* 📱 Very small devices */
    @media (max-width: 360px) {
      .code {
        font-size: 3.8rem;
      }

      .container {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="code">404</div>
    <div class="accent-bar"></div>

    <h2>Page Not Found</h2>

    <a class="btn" href="https://www.cse.iitb.ac.in/">Homepage</a>

    <div class="footer">
      Department of Computer Science and Engineering<br>
      IIT Bombay
    </div>
  </div>


</body></html>
